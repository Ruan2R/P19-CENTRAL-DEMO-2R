name: Build and test P19 source apps
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix apps/barber
      - run: npm ci --prefix apps/beauty
      - run: npm ci --prefix apps/burger
      - run: npm --prefix apps/barber test
      - run: npm --prefix apps/beauty test
      - run: npm --prefix apps/burger test
      - run: npm run build:demo
      - run: node scripts/test-demo-runtime.mjs
