<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#003e6a" />
    <meta name="description" content="Portfólio de Ruan Rodrigues, da 2R Informática. Aplicações web, sistemas de gestão, suporte e infraestrutura." />
    <title>2R Informática | Seu parceiro em Tecnologia</title>
    <style>
      .boot-fallback { min-height: 100vh; display: grid; place-content: center; gap: 10px; padding: 28px 20px; box-sizing: border-box; font: 15px/1.6 Arial, sans-serif; color: #182638; background: #f5f7fa; text-align: center; }
      .boot-fallback strong { font-size: 20px; }
      .boot-fallback span { color: #637489; }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        if (event.target && event.target.tagName === 'SCRIPT') {
          var root = document.getElementById('root');
          if (root) root.innerHTML = '<main class="boot-fallback"><strong>Não foi possível carregar a demonstração.</strong><span>Confira sua conexão e atualize a página. Se continuar, envie esta tela para a 2R Informática.</span><button onclick="window.location.reload()" style="min-height:44px;padding:0 16px;border:0;border-radius:9px;background:#00529d;color:white;font-weight:700">Tentar novamente</button></main>';
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback">
        <strong>Carregando a demonstração 2R…</strong>
        <span>Aguarde enquanto a aplicação é iniciada.</span>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
